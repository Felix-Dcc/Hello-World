<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ project.title }} · {% endblock %}Hello-World</title>
  <meta name="description" content="{% block description %}{{ project.blurb if project else 'Small Python projects with a friendly web UI.' }}{% endblock %}">
  <link rel="icon" href="{{ url_for('static', filename='favicon.svg') }}" type="image/svg+xml">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <script src="{{ url_for('static', filename='app.js') }}" defer></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="topbar">
    <div class="wrap topbar-inner">
      <a class="brand" href="{{ url_for('arcade.hub') }}"><span aria-hidden="true">🐍</span> Hello-World</a>
      {% if project %}<a class="back" href="{{ url_for('arcade.hub') }}">← All projects</a>{% endif %}
    </div>
  </header>

  <main id="main" class="wrap">
    {% block content %}{% endblock %}
  </main>

  <footer class="footer">
    <div class="wrap">
      Small Python projects by Felix Osei-Poku ·
      <a href="https://github.com/Felix-Dcc/hello-world">Source on GitHub</a>
    </div>
  </footer>
</body>
</html>
